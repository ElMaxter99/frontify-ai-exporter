name: Release
on:
  push: { branches: [main] }
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens/updates a "release PR" from Conventional Commits (feat:, fix:, deps:…); merging it tags a release + CHANGELOG.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
