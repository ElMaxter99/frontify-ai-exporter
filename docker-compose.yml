services:
  app:
    build:
      context: .
      args:
        EXTRAS: ""        # e.g. "chromadb faiss-cpu" to enable those vector stores
    ports:
      - "8000:8000"
    # Credentials come ONLY from the environment / .env (never baked into the image or sent to the browser).
    env_file:
      - path: .env
        required: false
    environment:
      EXPORT_DIR: /exports
      DATA_DIR: /data
    volumes:
      - ./exports:/exports
      - app-data:/data
    restart: unless-stopped

  # Optional vector database: docker compose --profile qdrant up --build
  # then set VECTOR_STORE=qdrant, QDRANT_URL=http://qdrant:6333 and build with EXTRAS="qdrant-client"
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  app-data:
  qdrant-data:
